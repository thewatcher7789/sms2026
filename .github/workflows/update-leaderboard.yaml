name: Update Leaderboard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      - name: Regenerate leaderboard
        run: |
          python summer_pool.py --entries entries.csv --csv summer_movies.csv
          mkdir -p docs
          mv leaderboard.html docs/index.html
          mv leaderboard.csv docs/leaderboard.csv
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Auto-update leaderboard"
          git push
